name: CI

on:
  pull_request:
  push:
    branches: [main]

# Keep only the latest verification for a branch or pull request. Rapid pushes
# must not queue obsolete three-OS matrices ahead of the current revision.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies including development tools
        run: npm audit --audit-level=moderate

  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify generated readable source is current
        shell: bash
        run: |
          npm run build
          git diff --exit-code

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install/install.sh

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'install/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Verify public source and package boundary
        run: npm run check:public

      - name: Run tests
        run: npm test

      - name: Run strict type checks
        run: npm run typecheck:strict

      - name: Verify bounded properties and counterexample detection
        if: runner.os == 'Linux'
        run: npm run verify:properties
      - name: Verify statechart model and failure detection
        if: runner.os == 'Linux'
        run: |
          npm run verify:statechart
          npm run verify:statechart -- --broken

      - name: Verify Causyne feature behavior gates
        if: runner.os == 'Linux'
        run: npm run verify:features -- tui-usage tui-turn-rail agent-loop plugin-safety formal-state

      - name: Drive actual Causyne TUI in isolated terminal
        if: runner.os == 'Linux'
        run: npm run verify:ui

  browser-runtime-smoke:
    name: real Chromium browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install smoke-only Playwright driver (no browser download)
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.58.0

      - name: Exercise real browser runtime without an LLM API
        run: node scripts/verify-browser-runtime.mjs
